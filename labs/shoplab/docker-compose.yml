services:
  db:
    build: ./database
    image: websec-postgres:17-alpine
    profiles: [core]
    environment:
      POSTGRES_DB: websec
      POSTGRES_USER: websec
      POSTGRES_PASSWORD: local-training-only
    volumes:
      - websec-db:/var/lib/postgresql/data
    networks: [core]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U websec -d websec]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: ./app
    image: websec-api:local
    profiles: [core]
    environment:
      LAB_MODE: ${LAB_MODE:-vulnerable}
      DATABASE_URL: postgresql://websec:local-training-only@db:5432/websec
      LAB_SIGNING_KEY: synthetic-local-key-not-for-production
      LOG_PATH: /var/log/websec/app.jsonl
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - websec-logs:/var/log/websec
    networks: [core]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  app:
    image: nginx:1.28-alpine
    profiles: [core]
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    networks: [core]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, wget -qO- http://127.0.0.1/ >/dev/null]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  proxy:
    image: nginx:1.28-alpine
    profiles: [core]
    depends_on:
      api:
        condition: service_healthy
      app:
        condition: service_healthy
    ports:
      - 127.0.0.1:${SHOPLAB_HTTP_PORT:-8080}:8080
      - 127.0.0.1:${SHOPLAB_HTTPS_PORT:-8443}:8443
    volumes:
      - ./.state/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.state/tls:/etc/nginx/tls:ro
    networks: [core, edge]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, wget -qO- http://127.0.0.1:8080/api/health >/dev/null]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  security-tools:
    build: ./security-tools
    image: websec-security-tools:local
    profiles: [security]
    volumes:
      - ./app:/workspace/app:ro
      - ../../:/workspace/course:ro
    working_dir: /workspace/app
    networks: [core, feeds]
    read_only: true
    # pip-audit creates an isolated resolver environment, so this one-shot
    # analysis container needs an executable temporary filesystem.
    tmpfs: ["/tmp:exec"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  zap:
    image: ghcr.io/zaproxy/zaproxy:2.17.0
    profiles: [security]
    command: [zap.sh, -daemon, -host, 0.0.0.0, -port, "8090", -config, api.disablekey=true]
    networks: [core]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  gitleaks:
    image: zricethezav/gitleaks:v8.30.1
    profiles: [security]
    volumes:
      - ../../:/workspace:ro
    working_dir: /workspace
    networks: [core]

  trivy:
    image: aquasec/trivy:0.74.0
    profiles: [security]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - trivy-cache:/root/.cache/
    networks: [feeds]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    profiles: [observe]
    command: [--config=/etc/otelcol-contrib/config.yaml]
    volumes:
      - ./observability/otel-config.yml:/etc/otelcol-contrib/config.yaml:ro
    networks: [core]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.14.0
    profiles: [observe]
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus]
    ports:
      - 127.0.0.1:${SHOPLAB_PROM_PORT:-9090}:9090
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [core, edge]
    depends_on: [api, otel-collector]
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.7
    profiles: [observe]
    command: [-config.file=/etc/loki/local-config.yaml]
    ports:
      - 127.0.0.1:${SHOPLAB_LOKI_PORT:-3100}:3100
    volumes:
      - ./observability/loki.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks: [core, edge]
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.19.2
    profiles: [observe]
    command: [run, /etc/alloy/config.alloy, --storage.path=/var/lib/alloy/data]
    volumes:
      - ./observability/config.alloy:/etc/alloy/config.alloy:ro
      - websec-logs:/var/log/websec:ro
      - alloy-data:/var/lib/alloy/data
    networks: [core]
    depends_on: [loki]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.1
    profiles: [observe]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: local-training-only
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    ports:
      - 127.0.0.1:${SHOPLAB_GRAFANA_PORT:-3000}:3000
    volumes:
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana-data:/var/lib/grafana
    networks: [core, edge]
    depends_on: [prometheus, loki]
    restart: unless-stopped

networks:
  core:
    internal: true
  edge:
  feeds:

volumes:
  websec-db:
  websec-logs:
  prometheus-data:
  loki-data:
  alloy-data:
  grafana-data:
  trivy-cache:
