server {
  listen 8080;
  listen 8443 ssl;
  server_tokens off;
  ssl_certificate /etc/nginx/tls/lab.crt;
  ssl_certificate_key /etc/nginx/tls/lab.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=300" always;

  location /api/ {
    proxy_pass http://api:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-ID $request_id;
  }
  location = /openapi.json { proxy_pass http://api:8000/openapi.json; }
  location / { proxy_pass http://app/; }
}
